name: Validate Project

on:
  push:
    branches:
      - main
      - dev
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Godot import and scene tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: barichello/godot-ci:4.6.1
    env:
      GODOT_BIN: godot
      VALIDATION_LOG_DIR: ${{ github.workspace }}/validation-logs
      TEST_LOG_DIR: ${{ github.workspace }}/validation-logs/scene-tests
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Check Python runtime
        run: python3 --version

      - name: Install development validation dependencies
        run: python3 -m pip install --requirement requirements-dev.txt

      - name: Validate import, contracts, and scene tests
        run: ./tools/validate_project.sh

      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: godot-validation-logs
          path: validation-logs/
          if-no-files-found: warn
          retention-days: 14
